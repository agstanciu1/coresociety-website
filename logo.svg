<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g fill="currentColor" stroke="currentColor">
    <!-- C-shaped pilates ring (gap at upper-left, ~130° to ~230° from 3 o'clock) -->
    <path d="M 24.4 30.9 A 34 34 0 1 1 30.9 75.6"
          fill="none" stroke-width="11" stroke-linecap="butt"/>

    <!-- Handle prong from top of gap (extending upper-left) -->
    <path d="M 24.4 30.9 L 16 21.5" fill="none" stroke-width="9" stroke-linecap="round"/>

    <!-- Handle prong from bottom of gap (extending lower-left) -->
    <path d="M 30.9 75.6 L 21.5 84" fill="none" stroke-width="9" stroke-linecap="round"/>

    <!-- Center dot -->
    <circle cx="50" cy="50" r="8" stroke="none"/>

    <!-- Gear teeth (rectangular protrusions on outer ring) -->
    <!-- Top tooth (12 o'clock) -->
    <rect x="44" y="3" width="12" height="12" rx="1.5" stroke="none"/>

    <!-- Right tooth (3 o'clock) -->
    <rect x="85" y="44" width="12" height="12" rx="1.5" stroke="none"/>

    <!-- Bottom tooth (6 o'clock) -->
    <rect x="44" y="85" width="12" height="12" rx="1.5" stroke="none"/>

    <!-- Bottom-right tooth (~4:30) -->
    <g transform="rotate(45 50 50)">
      <rect x="44" y="85" width="12" height="12" rx="1.5" stroke="none"/>
    </g>
  </g>
</svg>
